<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Charlie VRM Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent !important;
            background-size: cover;
            background-position: center;
        }
        canvas {
            display: block;
            background-color: transparent !important;
        }
        #status-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            /* Glass panel: stronger blur + soft border + layered shadow reads
               more premium than the old flat dark chip. */
            background: rgba(20, 24, 34, 0.45);
            padding: 12px 26px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 20px rgba(0, 255, 255, 0.15);
            display: none;
            z-index: 100;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            animation: pulse 1.6s infinite;
            white-space: nowrap;
        }
        @keyframes pulse {
            0% { opacity: 0.85; box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 12px rgba(0, 255, 255, 0.35); }
            50% { opacity: 1; box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 24px rgba(0, 255, 255, 0.7); }
            100% { opacity: 0.85; box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 12px rgba(0, 255, 255, 0.35); }
        }
    </style>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <div id="status-indicator"></div>
    <div id="debug-panel" style="display:none; position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8); color:lime; padding:10px; font-family:monospace; z-index:1000; font-size:12px;">
        <b>Pose Debugger</b><br>
        <label><input type="checkbox" id="debug_enable"> Enable Sliders</label>
        <button id="copy-btn" style="margin-left:10px; margin-bottom:5px;">Copy values</button><br>
        RUx: <input type="range" id="ru_x" min="-3.14" max="3.14" step="0.05" value="-0.9"><span id="val_ru_x">-0.9</span>
        RUy: <input type="range" id="ru_y" min="-3.14" max="3.14" step="0.05" value="0.3"><span id="val_ru_y">0.3</span>
        RUz: <input type="range" id="ru_z" min="-3.14" max="3.14" step="0.05" value="-0.4"><span id="val_ru_z">-0.4</span><br>
        RLx: <input type="range" id="rl_x" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_rl_x">0</span>
        RLy: <input type="range" id="rl_y" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_rl_y">0</span>
        RLz: <input type="range" id="rl_z" min="-3.14" max="3.14" step="0.05" value="1.9"><span id="val_rl_z">1.9</span><br>
        RHx: <input type="range" id="rh_x" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_rh_x">0</span>
        RHy: <input type="range" id="rh_y" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_rh_y">0</span>
        RHz: <input type="range" id="rh_z" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_rh_z">0</span><br>
        RFc: <input type="range" id="rf_c" min="-1.5" max="1.5" step="0.05" value="0"><span id="val_rf_c">0</span> (Fingers)<br>
        LUx: <input type="range" id="lu_x" min="-3.14" max="3.14" step="0.05" value="-0.3"><span id="val_lu_x">-0.3</span>
        LUy: <input type="range" id="lu_y" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_lu_y">0</span>
        LUz: <input type="range" id="lu_z" min="-3.14" max="3.14" step="0.05" value="0.9"><span id="val_lu_z">0.9</span><br>
        LLx: <input type="range" id="ll_x" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_ll_x">0</span>
        LLy: <input type="range" id="ll_y" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_ll_y">0</span>
        LLz: <input type="range" id="ll_z" min="-3.14" max="3.14" step="0.05" value="1.1"><span id="val_ll_z">1.1</span><br>
        LHx: <input type="range" id="lh_x" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_lh_x">0</span>
        LHy: <input type="range" id="lh_y" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_lh_y">0</span>
        LHz: <input type="range" id="lh_z" min="-3.14" max="3.14" step="0.05" value="0"><span id="val_lh_z">0</span><br>
        LFc: <input type="range" id="lf_c" min="-1.5" max="1.5" step="0.05" value="0"><span id="val_lf_c">0</span> (Fingers)<br>
    </div>
    <script type="module">
        const origWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string') {
                if (args[0].includes("Multiple instances of Three.js") || args[0].includes("Shader chunk")) return;
            }
            origWarn.apply(console, args);
        };

        import * as THREE from './vendor/three/build/three.module.js';
        import { GLTFLoader } from './vendor/three/examples/jsm/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from './vendor/three-vrm/lib/three-vrm.module.js';

        window.DEBUG_POSE_MODE = false;
        if (window.DEBUG_POSE_MODE) {
            document.getElementById('debug-panel').style.display = 'block';
            const ids = [
                'ru_x', 'ru_y', 'ru_z', 'rl_x', 'rl_y', 'rl_z', 'rh_x', 'rh_y', 'rh_z', 'rf_c', 
                'lu_x', 'lu_y', 'lu_z', 'll_x', 'll_y', 'll_z', 'lh_x', 'lh_y', 'lh_z', 'lf_c'
            ];
            ids.forEach(id => {
                document.getElementById(id).addEventListener('input', (e) => {
                    document.getElementById('val_' + id).innerText = e.target.value;
                });
            });
            document.getElementById('copy-btn').addEventListener('click', () => {
                const vals = ids.map(id => document.getElementById(id).value);
                const code = `tRU.set(${vals[0]}, ${vals[1]}, ${vals[2]}); tRL.set(${vals[3]}, ${vals[4]}, ${vals[5]}); tRH.set(${vals[6]}, ${vals[7]}, ${vals[8]}); tRFingers.set(0, 0, ${vals[9]});\n` +
                             `tLU.set(${vals[10]}, ${vals[11]}, ${vals[12]}); tLL.set(${vals[13]}, ${vals[14]}, ${vals[15]}); tLH.set(${vals[16]}, ${vals[17]}, ${vals[18]}); tLFingers.set(0, 0, ${vals[19]});`;
                navigator.clipboard.writeText(code).catch(e => console.error(e));
            });
        }

        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0.0, 1.3, 0.7); 

        const mouseNDC = new THREE.Vector2(0, 0);
        window.addEventListener('mousemove', (e) => {
            mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setClearColor(0x000000, 0); 
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff);
        light.position.set(1.0, 1.0, 1.0).normalize();
        scene.add(light);
        
        const ambientLight = new THREE.AmbientLight(0xaaaaaa);
        scene.add(ambientLight);

        let currentVrm = null;
        let clock = new THREE.Clock();
        
        const lookAtTarget = new THREE.Object3D();
        scene.add(lookAtTarget);

        const loader = new GLTFLoader();
        loader.crossOrigin = 'anonymous';

        loader.register((parser) => {
            return new VRMLoaderPlugin(parser);
        });

        loader.load(
            'http://127.0.0.1:8123/MODEL.vrm',
            (gltf) => {
                const vrm = gltf.userData.vrm;
                if (!vrm) return;

                scene.add(vrm.scene);
                currentVrm = vrm;
                
                vrm.scene.rotation.y = Math.PI;
                VRMUtils.rotateVRM0(vrm);
                
                window.currentAnimation = 'startup';
                window.animTimer = 0;
                window.blinkTimer = 0;
                window.nextBlink = Math.random() * 4 + 2;
                window.lipSyncVolume = 0;
                window.currentVisemes = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
                window.targetVisemes = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
                window.smilePulse = 0; // 0-1, decays over time, added on top of normal expression
                
                setTimeout(() => { if (window.currentAnimation === 'startup') window.currentAnimation = 'idle'; }, 2500);
            },
            (progress) => console.log('Loading model...', 100.0 * (progress.loaded / progress.total), '%'),
            (error) => console.error(error)
        );

        let windActive = false;
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();
            
            if (currentVrm) {
                const clampedDelta = Math.min(deltaTime, 0.05);
                currentVrm.update(clampedDelta);
                
                const time = clock.getElapsedTime();
                const h = currentVrm.humanoid;
                const spine = h.getNormalizedBoneNode('spine');
                const head = h.getNormalizedBoneNode('head');
                const neck = h.getNormalizedBoneNode('neck');
                const rUpper = h.getNormalizedBoneNode('rightUpperArm');
                const lUpper = h.getNormalizedBoneNode('leftUpperArm');
                const rLower = h.getNormalizedBoneNode('rightLowerArm');
                const lLower = h.getNormalizedBoneNode('leftLowerArm');
                const rHand = h.getNormalizedBoneNode('rightHand');
                const rIndex = h.getNormalizedBoneNode('rightIndexProximal');
                const rMiddle = h.getNormalizedBoneNode('rightMiddleProximal');
                const rRing = h.getNormalizedBoneNode('rightRingProximal');
                const rLittle = h.getNormalizedBoneNode('rightLittleProximal');
                const rThumb = h.getNormalizedBoneNode('rightThumbProximal');
                
                const lHand = h.getNormalizedBoneNode('leftHand');
                const lIndex = h.getNormalizedBoneNode('leftIndexProximal');
                const lMiddle = h.getNormalizedBoneNode('leftMiddleProximal');
                const lRing = h.getNormalizedBoneNode('leftRingProximal');
                const lLittle = h.getNormalizedBoneNode('leftLittleProximal');
                const lThumb = h.getNormalizedBoneNode('leftThumbProximal');
                
                // --- Blinking ---
                window.blinkTimer += clampedDelta;
                if (window.blinkTimer > window.nextBlink) {
                    const blinkProgress = window.blinkTimer - window.nextBlink;
                    const blinkDuration = 0.15;
                    if (blinkProgress < blinkDuration) {
                        let blinkVal = 0;
                        if (blinkProgress < blinkDuration * 0.33) {
                            blinkVal = blinkProgress / (blinkDuration * 0.33);
                        } else if (blinkProgress < blinkDuration * 0.66) {
                            blinkVal = 1.0;
                        } else {
                            blinkVal = 1.0 - ((blinkProgress - blinkDuration * 0.66) / (blinkDuration * 0.34));
                        }
                        currentVrm.expressionManager.setValue('blink', blinkVal);
                    } else {
                        currentVrm.expressionManager.setValue('blink', 0.0);
                        window.blinkTimer = 0;
                        window.nextBlink = Math.random() * 5 + 1.5;
                    }
                } else {
                    currentVrm.expressionManager.setValue('blink', 0.0);
                }
                
                // --- Idle sway (breathing-like) ---
                const spineNoise1 = Math.sin(time * 1.7) * 0.4 + Math.sin(time * 0.8) * 0.6;
                const spineNoise2 = Math.sin(time * 1.3 + 1.1) * 0.4 + Math.sin(time * 0.5 + 2.3) * 0.6;
                const headNoise1 = Math.sin(time * 0.8) * 0.4 + Math.sin(time * 0.3) * 0.6;
                const headNoise2 = Math.sin(time * 1.2 + 0.7) * 0.4 + Math.sin(time * 0.4 + 1.5) * 0.6;
                let tSpine = new THREE.Euler(spineNoise1 * 0.015, 0, spineNoise2 * 0.015);
                let tHead = new THREE.Euler(headNoise1 * 0.01, headNoise2 * 0.02, 0);
                
                // --- Multi-viseme lipsync ---
                const visemeLerpSpeed = 18;
                let totalMouthOpen = 0;
                for (const key of ['aa', 'ih', 'ou', 'ee', 'oh']) {
                    const cur = window.currentVisemes[key];
                    const tgt = window.targetVisemes[key];
                    const next = cur + (tgt - cur) * Math.min(clampedDelta * visemeLerpSpeed, 1);
                    window.currentVisemes[key] = next;
                    currentVrm.expressionManager.setValue(key, next);
                    totalMouthOpen = Math.max(totalMouthOpen, next);
                }

                if (totalMouthOpen > 0.05) {
                    tHead.x -= totalMouthOpen * 0.15;
                    currentVrm.expressionManager.setValue('surprised', totalMouthOpen * 0.3);
                } else {
                    currentVrm.expressionManager.setValue('surprised', 0.0);
                }

                // --- Post-response smile pulse ---
                // A short-lived expression bump triggered from Python once a
                // reply finishes, decaying back to whatever the idle
                // expression would normally be. Layered independently of
                // currentAnimation so it doesn't fight the pose logic below.
                if (window.smilePulse > 0) {
                    window.smilePulse = Math.max(0, window.smilePulse - clampedDelta / 1.4);
                    currentVrm.expressionManager.setValue('happy', Math.max(
                        currentVrm.expressionManager.getValue('happy') || 0,
                        window.smilePulse * 0.6
                    ));
                    currentVrm.expressionManager.setValue('relaxed', Math.max(
                        currentVrm.expressionManager.getValue('relaxed') || 0,
                        window.smilePulse * 0.35
                    ));
                }
                
                // --- Procedural pose per animation state ---
                window.animTimer += clampedDelta;
                let tRU = new THREE.Euler(0, 0, -1.2);
                let tLU = new THREE.Euler(0, 0, 1.2);
                let tRL = new THREE.Euler(0, 0, 0);
                let tLL = new THREE.Euler(0, 0, 0);
                let tNeck = new THREE.Euler(0, 0, 0);
                let tRH = new THREE.Euler(0, 0, 0);
                let tRFingers = new THREE.Euler(0, 0, 0);
                let tLH = new THREE.Euler(0, 0, 0);
                let tLFingers = new THREE.Euler(0, 0, 0);
                
                if (window.currentAnimation === 'startup') {
                    tRU.set(0.09, 1.01, -0.4);
                    tRL.set(-0.19, 0.01, 1.9);
                    tRH.set(0.26, 0, 0);
                    tRFingers.set(0, 0, 0);
                    tLU.set(-0.3, 0, 0.9);
                    tLL.set(0, 0, 1.1);
                    tLH.set(0, 0, 0);
                    tLFingers.set(0, 0, 0);
                    
                    if (currentVrm.springBoneManager) {
                        windActive = true;
                        const windPower = Math.max(0, 1.0 - (window.animTimer / 2.5));
                        const windX = (Math.sin(time * 5) * 0.1 + 0.3) * windPower;
                        
                        currentVrm.springBoneManager.joints.forEach((joint) => {
                            if (!joint._originalGravityDir) {
                                joint._originalGravityDir = joint.settings.gravityDir.clone();
                            }
                            if (joint.bone && joint.bone.name.toLowerCase().includes('hair')) {
                                joint.settings.gravityDir.set(
                                    joint._originalGravityDir.x + windX,
                                    joint._originalGravityDir.y,
                                    joint._originalGravityDir.z
                                ).normalize();
                            } else {
                                joint.settings.gravityDir.copy(joint._originalGravityDir);
                            }
                        });
                    }
                } else if (window.currentAnimation === 'thinking') {
                    if (windActive && currentVrm.springBoneManager) {
                        currentVrm.springBoneManager.joints.forEach((joint) => {
                            if (joint._originalGravityDir) {
                                joint.settings.gravityDir.copy(joint._originalGravityDir);
                            }
                        });
                        windActive = false;
                    }
                    tRU.set(-0.9, 0.36, -1.14);
                    tRL.set(-1.34, -0.24, 1.9); 
                    tRH.set(0, 0.76, 0);
                    tRFingers.set(0, 0, 0);
                    tLU.set(-0.3, 0, 0.9);
                    tLL.set(0, 0, 1.1);
                    tLH.set(-0.09, 0, 0);
                    tLFingers.set(0, 0, -0.05);
                    tNeck.set(-0.05, -0.15, 0.05);
                } else if (window.currentAnimation === 'happy' || window.currentAnimation === 'excited') {
                    tRU.set(-1.44, 0.41, 0.46);
                    tRL.set(0.46, 2.71, 0.96);
                    tRH.set(1.91, -0.19, 0.46);
                    tRFingers.set(0, 0, 0.3);
                    tLU.set(1.41, 0.16, 0.91);
                    tLL.set(0.31, -0.14, 1.31);
                    tLH.set(1.26, 0.41, 0.06);
                    tLFingers.set(0, 0, 0);
                    tNeck.set(0.1, 0, 0);
                } else if (window.currentAnimation === 'stop') {
                    tRU.set(-0.44, 1.31, -0.34);
                    tRL.set(-0.34, 0.61, 1.66);
                    tRH.set(-0.09, -0.09, 0.36);
                    tRFingers.set(0, 0, 0);
                    tLU.set(0.2, 0, 1.2); 
                    tLL.set(0, 0, 1.5);
                    tLH.set(0, 0, 0);
                    tLFingers.set(0, 0, 0);
                    tNeck.set(-0.1, 0.2, 0.05);
                } else if (window.currentAnimation === 'talking') {
                    tRU.set(-0.3, 0, Math.sin(window.animTimer * 2) * 0.1 - 1.0);
                    tRL.set(0, 0, 0.5 + Math.sin(window.animTimer * 2) * 0.2);
                    tLU.set(-0.2, 0, -Math.sin(window.animTimer * 2 + 0.5) * 0.1 + 1.0);
                    tLL.set(0, 0, 0.5 + Math.sin(window.animTimer * 2 + 0.5) * 0.2);
                } else if (window.currentAnimation === 'listening') {
                    tLU.set(0, 0, 1.2); 
                    tLL.set(0, 0, 0); 
                    tNeck.set(-0.1, 0, 0.05);
                } else {
                    if (windActive && currentVrm.springBoneManager) {
                        currentVrm.springBoneManager.joints.forEach((joint) => {
                            if (joint._originalGravityDir) {
                                joint.settings.gravityDir.copy(joint._originalGravityDir);
                            }
                        });
                        windActive = false;
                    }
                    const idleNoise1 = Math.sin(time * 0.37) * 0.4 + Math.sin(time * 0.11) * 0.6;
                    const idleNoise2 = Math.sin(time * 0.29 + 1.7) * 0.4 + Math.sin(time * 0.13 + 0.5) * 0.6;
                    tRU.set(0.05 + idleNoise1 * 0.03, 0, -1.35 + idleNoise1 * 0.05);
                    tLU.set(0.05 + idleNoise2 * 0.03, 0, 1.35 - idleNoise2 * 0.05);
                    tRL.set(0, 0, 0.1);
                    tLL.set(0, 0, 0.1);
                }
                
                if (window.DEBUG_POSE_MODE && document.getElementById('debug_enable').checked) {
                    tRU.set(
                        parseFloat(document.getElementById('ru_x').value),
                        parseFloat(document.getElementById('ru_y').value),
                        parseFloat(document.getElementById('ru_z').value)
                    );
                    tRL.set(
                        parseFloat(document.getElementById('rl_x').value),
                        parseFloat(document.getElementById('rl_y').value),
                        parseFloat(document.getElementById('rl_z').value)
                    );
                    tRH.set(
                        parseFloat(document.getElementById('rh_x').value),
                        parseFloat(document.getElementById('rh_y').value),
                        parseFloat(document.getElementById('rh_z').value)
                    );
                    tRFingers.set(0, 0, parseFloat(document.getElementById('rf_c').value));
                    tLU.set(
                        parseFloat(document.getElementById('lu_x').value),
                        parseFloat(document.getElementById('lu_y').value),
                        parseFloat(document.getElementById('lu_z').value)
                    );
                    tLL.set(
                        parseFloat(document.getElementById('ll_x').value),
                        parseFloat(document.getElementById('ll_y').value),
                        parseFloat(document.getElementById('ll_z').value)
                    );
                    tLH.set(
                        parseFloat(document.getElementById('lh_x').value),
                        parseFloat(document.getElementById('lh_y').value),
                        parseFloat(document.getElementById('lh_z').value)
                    );
                    tLFingers.set(0, 0, parseFloat(document.getElementById('lf_c').value));
                    tNeck.set(-0.05, -0.15, 0.05);
                }
                
                const applySlerp = (bone, eulerTarget, speed) => {
                    if (bone) {
                        const targetQuat = new THREE.Quaternion().setFromEuler(eulerTarget);
                        const t = 1 - Math.pow(1 - Math.min(clampedDelta * speed, 1), 2);
                        bone.quaternion.slerp(targetQuat, t);
                    }
                };
                
                applySlerp(spine, tSpine, 3);
                applySlerp(head, tHead, 4);
                applySlerp(neck, tNeck, 4);
                applySlerp(rUpper, tRU, 5);
                applySlerp(lUpper, tLU, 5);
                applySlerp(rLower, tRL, 5);
                applySlerp(lLower, tLL, 5);
                applySlerp(rHand, tRH, 5);
                applySlerp(rIndex, tRFingers, 5);
                applySlerp(rMiddle, tRFingers, 5);
                applySlerp(rRing, tRFingers, 5);
                applySlerp(rLittle, tRFingers, 5);
                applySlerp(rThumb, tRFingers, 5);
                applySlerp(lHand, tLH, 5);
                applySlerp(lIndex, tLFingers, 5);
                applySlerp(lMiddle, tLFingers, 5);
                applySlerp(lRing, tLFingers, 5);
                applySlerp(lLittle, tLFingers, 5);
                applySlerp(lThumb, tLFingers, 5);
                
                if (currentVrm.lookAt) {
                    const headBone = h.getNormalizedBoneNode('head');
                    if (headBone) {
                        const headWorldPos = new THREE.Vector3();
                        headBone.getWorldPosition(headWorldPos);
                
                        const vec = new THREE.Vector3(mouseNDC.x, mouseNDC.y, 0.5).unproject(camera);
                        const dir = vec.sub(camera.position).normalize();
                        const distance = (headWorldPos.z - camera.position.z) / dir.z;
                        const targetPos = camera.position.clone().add(dir.multiplyScalar(distance));
                
                        targetPos.x = THREE.MathUtils.clamp(targetPos.x, headWorldPos.x - 0.5, headWorldPos.x + 0.5);
                        targetPos.y = THREE.MathUtils.clamp(targetPos.y, headWorldPos.y - 0.3, headWorldPos.y + 0.3);
                
                        lookAtTarget.position.copy(targetPos);
                        currentVrm.lookAt.target = lookAtTarget;
                    }
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.updateLipSync = function(volume) {
            window.lipSyncVolume = volume;
        };

        window.updateViseme = function(visemeJsonStr) {
            try {
                const weights = JSON.parse(visemeJsonStr);
                window.targetVisemes = {
                    aa: weights.aa || 0,
                    ih: weights.ih || 0,
                    ou: weights.ou || 0,
                    ee: weights.ee || 0,
                    oh: weights.oh || 0,
                };
            } catch (e) {
                console.error('[VRM Engine] Bad viseme payload:', e);
            }
        };

        window.setEmotion = function(emotion) {
            if (currentVrm && currentVrm.expressionManager) {
                ['happy', 'angry', 'sad', 'relaxed', 'neutral'].forEach(e => {
                    currentVrm.expressionManager.setValue(e, 0);
                });
                
                let vrmEmot = 'neutral';
                if (emotion === 'happy' || emotion === 'excited') vrmEmot = 'happy';
                if (emotion === 'concerned') vrmEmot = 'sad';
                if (emotion === 'curious') vrmEmot = 'relaxed';
                
                currentVrm.expressionManager.setValue(vrmEmot, 1.0);
                
                if (emotion === 'talking' || emotion === 'happy') {
                    window.currentAnimation = 'talking';
                } else if (emotion === 'thinking' || emotion === 'curious') {
                    window.currentAnimation = 'thinking';
                } else if (emotion === 'concerned' || emotion === 'sad' || emotion === 'angry') {
                    window.currentAnimation = 'stop';
                } else if (emotion === 'listening') {
                    window.currentAnimation = 'listening';
                } else {
                    window.currentAnimation = 'idle';
                }
            }
        };

        // --- Post-response smile trigger, called from Python after a reply finishes ---
        window.flashSmile = function() {
            window.smilePulse = 1.0;
        };

        // --- Status readout (listening / thinking / executing) ---
        // Both listening and the new thinking/executing states write into
        // the same glass-panel element so only one status shows at a time.
        window.setStatusText = function(html) {
            const indicator = document.getElementById('status-indicator');
            if (!html) {
                indicator.style.display = 'none';
                indicator.innerHTML = '';
                return;
            }
            indicator.innerHTML = html;
            indicator.style.display = 'block';
        };

        const MIC_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="white" style="vertical-align: middle; margin-right: 8px; margin-bottom: 3px;">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>`;

        window.setListening = function(isListening) {
            window.setStatusText(isListening ? (MIC_SVG + 'Listening...') : '');
        };

        // Driven from Python at each real pipeline stage — no fake/rotating
        // text here, since a status claiming to "search" when nothing is
        // actually being searched would be misleading rather than polish.
        window.setStatusTextFromPython = function(text) {
            window.setStatusText(text);
        };

        window.setBackground = function(bgName) {
            if (bgName === 'none') {
                document.body.style.backgroundImage = "none";
                return;
            }
            
            const url = "http://127.0.0.1:8123/" + bgName + "?t=" + new Date().getTime();
            const img = new Image();
            img.onload = function() {
                document.body.style.backgroundImage = "url('" + url + "')";
                if (bgName.includes('scifi')) {
                    light.color.setHex(0xd0ffff);
                    ambientLight.color.setHex(0x5555aa);
                } else {
                    light.color.setHex(0xffffff);
                    ambientLight.color.setHex(0xaaaaaa);
                }
            };
            img.onerror = function() {
                console.error("[VRM Engine] CRITICAL 404: Failed to load background image: " + url);
            };
            img.src = url;
        };

        window.setMode = function(mode) {
            if (mode === 'cinematic') {
                window.setBackground('chatgpt_bg.png'); 
                camera.position.set(0.0, 1.25, 2.1);
                camera.lookAt(0.0, 1.2, 0.0);
            } else if (mode === 'widget') {
                document.body.style.backgroundImage = "radial-gradient(circle, rgba(0,25,50,0.8) 0%, rgba(0,0,0,0) 70%)";
                camera.position.set(0.0, 1.35, 1.8); 
                camera.lookAt(0.0, 1.35, 0.0);
            }
        };

        if (typeof qt !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                window.bridge = channel.objects.bridge;
                bridge.volumeChanged.connect(window.updateLipSync);
                bridge.emotionChanged.connect(window.setEmotion);
                bridge.modeChanged.connect(window.setMode);
                bridge.listeningStatusChanged.connect(window.setListening);
                if (bridge.visemeChanged) {
                    bridge.visemeChanged.connect(window.updateViseme);
                }
                if (bridge.statusTextChanged) {
                    bridge.statusTextChanged.connect(window.setStatusTextFromPython);
                }
                if (bridge.smilePulseRequested) {
                    bridge.smilePulseRequested.connect(window.flashSmile);
                }
                if (bridge.backgroundChanged) {
                    bridge.backgroundChanged.connect(window.setBackground);
                }
                
                window.setMode('cinematic');
            });
        }
    </script>
</body>
</html>
